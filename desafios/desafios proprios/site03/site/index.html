<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../imagens/android-chrome-192x192.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Aether Maping</title>
</head>
<body>
        <header>
            <div id="barra-oculta">
                <img src="../imagens/setas-para-cima.png" alt="seta para" id="seta-alternavel">
            </div>
            <div id="conteudo-oculto">
                <button>Início</button>
                <button>Serviços</button>
                <button>Inovação</button>
                <button>Localização</button>
                <button>Contato</button>
            </div>
            <div id="conteudo-oculto-perfil">
                <table>
                    <tr>
                        <td style="font-size: 1.8rem;">Login</td>
                    </tr>
                    <tr>
                        <td>E-mail:</td>
                        <td><input type="text" name="email" maxlength="100" class="input"></td>
                    </tr>
                    <tr>
                        <td>Senha:</td>
                        <td><input type="text" name="email" maxlength="100" class="input"></td>
                    </tr>
                    <tr id="botao-enviar">
                        <td colspan="2"><input type="button" value="Enviar" onclick="valida_envia()" style="padding: 2px 10px 2px 10px; border-radius: 10px; font-size: 1.2rem;"></td>
                    </tr>
                </table>
            </div>
            <nav id="perfil">
                <button id="bt-perfil"><abbr title="Perfil"><img src="../imagens/imagem-perfil.webp" alt="Perfil"></abbr></button>
            </nav>
            <nav id="menu">
                <button id="bt-menu"><abbr title="Menu"><img src="../imagens/cardapio.png" alt="Menu"></abbr></button>
            </nav>
        </header>
        <main >
            <section class="carrocel">

                <div id="carrocel_01">

                    <input type="radio" name="radio_btn" id="radio1">
                    <input type="radio" name="radio_btn" id="radio2">
                    <input type="radio" name="radio_btn" id="radio3">

                    <div class="page-1">
                        <h1 style="font-size: 6.5em;">Aether</h1>
                        <h1 style="font-size: 5.5em;">Maping</h1>
                        <h1 style="font-size: 3.5em;">evolução</h1>
                        <h1 style="font-size: 2.5em;">inovação</h1>
                        <h1 style="font-size: 1.5em;">segurança</h1>
                    </div>

                    <div class="page-2">
                        
                    </div>

                    <div class="page-3">
                        
                    </div>

                    <div id="navigation-auto">
                        <div id="auto-btn1"></div>
                        <div id="auto-btn2"></div>
                        <div id="auto-btn3"></div>
                    </div>

                </div>

                <div id="manual-navigation">
                    <label for="radio1" class="manual-btn"></label>
                    <label for="radio2" class="manual-btn"></label>
                    <label for="radio3" class="manual-btn"></label>
                </div>

            </section>
        </main>
        <script src="moviment.js"></script>
</body>
</html>
