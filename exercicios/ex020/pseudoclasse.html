<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <style>
        div {
            display: inline-block;
            background-color: rgb(154, 154, 154);
            border: 1px solid black;
            width: 200px;
            height: 200px;
            text-align: center;
        }
        
        div:hover {
            background-color: rgb(146, 146, 146);
        }
    </style>
</head>
<body>
    <div id="d01">01</div>
    <div id="d02">02</div>
    <div id="d03">03</div>
</body>
</html>
