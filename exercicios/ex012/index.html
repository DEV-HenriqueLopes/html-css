<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo com Html5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este video está hospedado no meu proprio servidor</p>
    <video controls width="200" loop autoplay>
        <source src="midias/meu-videomp4.mp4" type="video/mp4">
        <source src="midias/meu-videowbnv.webm" type="video/webm">
        <p>Seu navegador não tem compatibilidade com o vídeo, link para dowload: <a href="midias/meu-videomp4.mp4" target="_blank" rel="external" download="vídeo.mp4">Dowload</a>
        </p>
    </video>
    <h1>Inserindo vídeos do youtube</h1>
    <iframe width="200" height="315" src="https://www.youtube.com/embed/yLOUahp-RIc?si=3wdyChH0jTRgyIbX" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
