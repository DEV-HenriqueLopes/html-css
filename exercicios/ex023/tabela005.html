<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 60vw;
            border-collapse: collapse;
        }

        caption {
            background-color: lightgray;
            padding: 2%;
        }

        td, th {
            border: 1px solid black;
            padding: 2%;
            text-align: center;
            vertical-align: middle;
        }

        col.cnome {
            background-color: rgb(90, 90, 90);
        }
    </style>
</head>
<body>
    <h1>Exercicio de tabelas</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>Feminino</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>João Carlos</td>
            <td>Masculino</td>
            <td>30</td>
            <td>Engenheiro</td>
        </tr>
        <tr>
            <td>Maria Clara</td>
            <td>Feminino</td>
            <td>22</td>
            <td>Designer</td>
        </tr>
        <tr>
            <td>Pedro Henrique</td>
            <td>Masculino</td>
            <td>28</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Carla Beatriz</td>
            <td>Feminino</td>
            <td>27</td>
            <td>Advogada</td>
        </tr>
    </table>
</body>
</html>
