<!DOCTYPE html>
<html lang="pt-br"> 
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fontes externas</title>
        <style>
            @font-face {
                font-family: 'marola';
                src: url('Overwave_.ttf') format('TrueType'), url('Overwave.otf') format('opentype');
                font-weight: normal;
                font-style: normal;
            }
            body {
                font-family: Arial, Helvetica, sans-serif;
            }
            h1 {
                font-family: 'marola', serif;
                font-size: 3em;
            }
        </style>
    </head>
    <body>
        <h1>Titulo</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Aperiam repudiandae quasi aliquid magni, ipsum asperiores explicabo, odit deserunt voluptatibus officiis aut, dolore vero modi saepe sint omnis quidem cum necessitatibus.</p>
    </body>
</html>
